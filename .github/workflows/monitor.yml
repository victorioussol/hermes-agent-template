name: Monitor Hermes production

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Monitor action to run
        required: true
        default: check
        type: choice
        options:
          - check
          - alert-test
          - recovery-test

permissions:
  contents: read
  actions: read

concurrency:
  group: hermes-production-monitor
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check, alert, and recover once when safe
        env:
          MONITOR_MODE: ${{ inputs.mode || 'check' }}
          HERMES_HEALTH_URL: https://hermes-agent-production-fe7b.up.railway.app/health
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: bc8fc30d-2d1a-4870-aef6-63b12137fda3
          RAILWAY_ENVIRONMENT: production
          RAILWAY_SERVICE_ID: 75cfd6d8-28cb-40f0-8866-ca7a9fa68b03
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python hermes_monitor.py --mode "$MONITOR_MODE"
