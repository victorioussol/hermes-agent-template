name: Monitor Hermes production

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hermes-production-monitor
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check service and scheduled agents
        run: |
          curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            --retry 2 --retry-delay 5 --retry-all-errors \
            https://hermes-agent-production-fe7b.up.railway.app/health
