name: Secret scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the candidate tree
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan pull-request additions without printing values
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/security/secret-scan.py --range "$BASE_SHA...HEAD"
      - name: Scan additions pushed to main without printing values
        if: github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event.before }}
        run: python3 scripts/security/secret-scan.py --range "$BASE_SHA..HEAD"
      - name: Scan the latest commit when run manually
        if: github.event_name == 'workflow_dispatch'
        run: python3 scripts/security/secret-scan.py --range "HEAD^..HEAD"
