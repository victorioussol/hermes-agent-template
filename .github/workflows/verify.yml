name: Verify Hermes wrapper

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt pyyaml
      - run: python -m py_compile server.py career_outbox_append.py hermes_monitor.py
      - run: python -m unittest discover -s tests -v

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: hermes-wrapper:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: bash tests/smoke_image.sh hermes-wrapper:ci
