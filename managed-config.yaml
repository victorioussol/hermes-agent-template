# Deployment-owned cost and reliability policy. Hermes overlays these leaves
# on the editable dashboard config, so a saved UI choice cannot silently move
# the main agent onto the metered OpenRouter key.
model:
  provider: openai-codex
  default: gpt-5.6-terra

# This fallback is safe to enable only after the Hermes OpenRouter key has a
# provider-side USD 5 monthly limit. The deployment runbook treats that
# read-back as a release gate.
fallback_providers:
  - provider: openrouter
    model: deepseek/deepseek-v4-flash

delegation:
  provider: openrouter
  model: deepseek/deepseek-v4-flash
  reasoning_effort: high
  max_iterations: 20
  max_concurrent_children: 2
  max_spawn_depth: 1
  orchestrator_enabled: true
  max_summary_chars: 8000

auxiliary:
  # Keep automatic discovery on free SKUs only. Paid OpenRouter use is limited
  # to the explicit DeepSeek Flash routes below and the provider-side cap.
  free_only: true
  vision:
    provider: openai-codex
    model: gpt-5.6-terra
    reasoning_effort: low
  web_extract: &flash_fast
    provider: openrouter
    model: deepseek/deepseek-v4-flash
  compression: *flash_fast
  title_generation: *flash_fast
  profile_describer: *flash_fast
  skills_hub: &flash_reasoning
    provider: openrouter
    model: deepseek/deepseek-v4-flash
    reasoning_effort: high
  mcp: *flash_reasoning
  triage_specifier: *flash_reasoning
  kanban_decomposer: *flash_reasoning
  curator: *flash_reasoning
  approval:
    provider: openai-codex
    model: gpt-5.6-sol
    reasoning_effort: low

# Mixture-of-Agents is opt-in and multiplies calls. Keep its manual preset on
# one cheap independent reference plus subscription-backed final synthesis.
moa:
  presets:
    default:
      reference_models:
        - provider: openrouter
          model: deepseek/deepseek-v4-flash
        - provider: openai-codex
          model: gpt-5.6-terra
      aggregator:
        provider: openai-codex
        model: gpt-5.6-sol
      max_tokens: 1536
      enabled: true

# Detached dashboard chats can be restored from disk; keeping fewer live
# agents prevents idle sessions from steadily consuming Railway memory.
max_live_sessions: 8

security:
  redact_secrets: true
